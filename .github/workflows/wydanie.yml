# Automatyczne wydanie wtyczki BookManager.
# Wystarczy wgrać do GŁÓWNEGO katalogu repo plik bookmanager.zip
# (Add file → Upload files → Commit changes). Ta akcja sama:
#  1) sprawdzi zip (folder, wersja w nagłówku = BM_VERSION, składnia PHP),
#  2) utworzy Release vX.Y.Z z tym zipem (opis = zmiany.html z zipa),
#  3) zaktualizuje update.json – WordPress zobaczy aktualizację.
name: Wydanie wtyczki

on:
  push:
    branches: [main]
    paths: ['bookmanager.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź zip i odczytaj wersję
        id: v
        run: |
          set -e
          rm -rf /tmp/w && mkdir /tmp/w
          unzip -q bookmanager.zip -d /tmp/w
          MAIN=/tmp/w/bookmanager/bookmanager.php
          if [ ! -f "$MAIN" ]; then echo "::error::W zipie brak bookmanager/bookmanager.php"; exit 1; fi
          VER=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' "$MAIN" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r ')
          if [ -z "$VER" ]; then echo "::error::Brak numeru wersji w zipie"; exit 1; fi
          CONST=$(sed -n "s/^define( 'BM_VERSION', '\(.*\)' );.*/\1/p" "$MAIN" | tr -d '\r')
          if [ "$VER" != "$CONST" ]; then echo "::error::Version: $VER ≠ BM_VERSION $CONST"; exit 1; fi
          find /tmp/w -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Wersja: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/w/bookmanager/zmiany.html ]; then
            cp /tmp/w/bookmanager/zmiany.html /tmp/zmiany.html
          else
            echo "<h4>$VER</h4>" > /tmp/zmiany.html
          fi

      - name: Utwórz Release z zipem
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -e
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER już jest – podmieniam zip"
            gh release upload "v$VER" bookmanager.zip --clobber
          else
            gh release create "v$VER" bookmanager.zip --title "$VER" --notes-file /tmp/zmiany.html --latest
          fi

      - name: Zaktualizuj update.json
        env:
          VER: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          ver, repo = os.environ['VER'], os.environ['REPO']
          ch = open('/tmp/zmiany.html', encoding='utf-8').read()
          data = {
              "version": ver,
              "download_url": f"https://github.com/{repo}/releases/latest/download/bookmanager.zip",
              "homepage": f"https://github.com/{repo}",
              "requires_php": "8.0",
              "changelog": ch,
          }
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "update.json → $VER"
          git push
